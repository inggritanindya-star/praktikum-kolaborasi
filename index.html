<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Awal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="judulUtama">Halaman Awal</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Profil</a>
        <a href="#">Kontak</a>
    </nav>
    <main>
        <section>
            <article id="kotak-pesan" class="kartu-profil">
                <h2>Profil Siswa</h2>
                <p>Selamat datang di halaman utama website saya.</p>

                <p id="pesanStatus">Sedang Memuat...</p>

    <form id="formNama">
        <label for="inputNama">Nama:</label>
         <input type="text" id="inputNama" required>
         <button type="submit">simpan</button>
         </form>
         </article>

        </section>
    </main>
    <footer>
        <p>Praktikum RPL 2026</p>
    </footer>
    <script>
        document.getElementById("judulUtama").innerText = "Selamat Datang Siswa";

        document.getElementById("pesanStatus").innerText = "Data Berhasil Disimpan";

        document.getElementById("formNama").addEventListener("submit", function (e) {
            e.preventDefault();
            const nama = document.getElementById("inputNama").value.trim();
            if (nama === "") {
                document.getElementById("pesanStatus").innerText = "nama tidak boleh kosong"
                return;
            }
            document.getElementById("judulUtama").innerText = "Selamat Datang, " + nama;
            document.getElementById("pesanStatus").innerText = "Data Berhasil Disimpan";
        });
    </script>
</body>
</html>
